# Public roadmap: upcoming features to look out for, rendered at /roadmap. Edit this file, then build (./build.sh) or
# push to main to publish. Write for players. Internal and admin work belongs in the game repository's docs/roadmap.md.
#
# One teaser per feature, so no "X and Y" titles. Horizon: soon | working | later
# Icon: any name in the theme's src/pixelData.json (skelril-docs-theme)
# When a feature ships, delete its teaser and add a feature post in news/ (see README.md), in the same commit.

[horizons]
soon = "Soon"
working = "In the works"
later = "Later"

[[teasers]]
