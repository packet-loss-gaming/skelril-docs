# Public roadmap data, rendered at /roadmap. Edit this file, then build (./build.sh) or push to main to publish.
# Keep it short and in plain language: the detailed hand-off lives in the game repository's docs/roadmap.md.
# status: done | active | next | planned | later     icon: any name in the theme's src/pixelData.json (skelril-docs-theme)
title = "Skelril"
tagline = "The Grindstone server, rebuilt on Luanti."
updated = 2026-11-19

# A line ending in a backslash continues on the next line, without the line break.
intro = """\
  Skelril takes the City, the economy and the custom items of the Grindstone Minecraft server and rebuilds them as \
  a game on Luanti, on top of the Mineclonia base game. Here is what already works and what comes next.\
  """

[legend]
done = "Done"
active = "In progress"
next = "Up next"
planned = "Planned"
later = "Later"

